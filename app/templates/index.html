<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Scoring System</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container{
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            margin-bottom: 30px;
        }

        label{
            font-weight: bold;
        }

        input, select{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button{
            width: 100%;
            padding: 12px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            opacity: 0.9;
        }

        .result{
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
        }

        .high-risk{
            background-color: #ffd6d6;
            color: red;
        }

        .low-risk{
            background-color: #d6ffd9;
            color: green;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Credit Scoring System</h1>

        <form action="/predict" method="POST">

            <label>Age</label>
            <input type="number" name="age" required>

            <label>Job Level</label>
            <select name="job">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>

            <label>Credit Amount</label>
            <input type="number" name="credit_amount" required>

            <label>Loan Duration (Months)</label>
            <input type="number" name="duration" required>

            <label>Sex</label>
            <select name="sex">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Housing</label>
            <select name="housing">
                <option value="own">Own</option>
                <option value="rent">Rent</option>
                <option value="free">Free</option>
            </select>

            <label>Saving Accounts</label>
            <select name="saving_accounts">
                <option value="little">Little</option>
                <option value="moderate">Moderate</option>
                <option value="quite rich">Quite Rich</option>
                <option value="rich">Rich</option>
                <option value="unknown">Unknown</option>
            </select>

            <label>Checking Account</label>
            <select name="checking_account">
                <option value="little">Little</option>
                <option value="moderate">Moderate</option>
                <option value="rich">Rich</option>
                <option value="unknown">Unknown</option>
            </select>

            <label>Purpose</label>
            <select name="purpose">
                <option value="car">Car</option>
                <option value="radio/TV">Radio/TV</option>
                <option value="education">Education</option>
                <option value="furniture/equipment">Furniture</option>
                <option value="domestic appliances">Domestic Appliances</option>
                <option value="repairs">Repairs</option>
                <option value="vacation/others">Vacation/Others</option>
            </select>

            <button type="submit">
                Predict Risk
            </button>

        </form>

        {% if prediction %}

            {% if prediction == "HIGH RISK CUSTOMER" %}

                <div class="result high-risk">
                    {{ prediction }}
                    <br><br>
                    Default Risk Probability:
                    {{ probability }}%
                </div>

            {% else %}

                <div class="result low-risk">
                    {{ prediction }}
                    <br><br>
                    Default Risk Probability:
                    {{ probability }}%
                </div>

            {% endif %}

        {% endif %}

    </div>

</body>

</html>
